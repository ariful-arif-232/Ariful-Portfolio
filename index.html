<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E9EDF2" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Portfolio</title>
    <script>
      // Restores the deep link stashed by 404.html so GitHub Pages can serve
      // direct routes like /projects/some-slug without a server rewrite.
      (function () {
        var saved = sessionStorage.getItem('spa:redirect')
        if (saved) {
          sessionStorage.removeItem('spa:redirect')
          if (saved !== location.pathname + location.search + location.hash) {
            history.replaceState(null, '', saved)
          }
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
